:root{--bg:#0b0b0c;--s1:#141416;--s2:#1b1b1e;--line:#2a2a2e;--line2:#3a3a40;--txt:#f5f3f0;--mut:#9b9ba2;--acc:#e5252d;--acc2:#ff4b52;--accbg:rgba(229,37,45,.12);
 --sans:"MM Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --disp:"MM Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(112px + env(safe-area-inset-bottom));background:radial-gradient(900px 420px at 15% -80px,rgba(229,37,45,.13),transparent 70%),var(--bg);background-repeat:no-repeat}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.82);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.hrow{display:flex;align-items:baseline;justify-content:space-between;max-width:640px;margin:0 auto}
.brand{font-family:var(--disp);font-weight:800;letter-spacing:.14em;font-size:17px;text-transform:uppercase;line-height:1}
.brand b{color:var(--acc);font-weight:800}
.stepl{font-size:11px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.bar{height:3px;background:var(--line);margin:11px -18px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s var(--ease);box-shadow:0 0 12px rgba(229,37,45,.7)}
main{padding:26px max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));max-width:640px;margin:0 auto}
main>.view{animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.q{animation:in .45s var(--ease) both}
.q:nth-of-type(2){animation-delay:.04s}.q:nth-of-type(3){animation-delay:.08s}.q:nth-of-type(4){animation-delay:.12s}
h1{font-family:var(--disp);font-size:46px;line-height:.98;font-weight:800;text-transform:uppercase;letter-spacing:.005em;margin:6px 0 14px}
h1 em{font-style:normal;color:var(--acc)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.eyebrow:before{content:"";width:28px;height:3px;background:var(--acc);border-radius:2px}
h2.sec{font-family:var(--disp);font-size:36px;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:4px 0 8px}
.secno{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin:0}
p.intro{color:var(--mut);margin:6px 0 20px;font-size:16px}
p{margin:10px 0}
/* hero */
.hero .lead{font-size:19px;line-height:1.45;color:#e6e4e1;margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 20px}
.chip{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);border-radius:99px;padding:7px 12px;color:#e6e4e1;background:rgba(255,255,255,.03)}
.price{display:flex;align-items:baseline;gap:8px;margin:0 0 18px}.price b{font-family:"MM Display",sans-serif;font-size:34px;font-weight:800;color:#fff;letter-spacing:.01em}.price span{font-size:14px;color:#b9b6b2}
.chip.hot{border-color:rgba(229,37,45,.55);background:var(--accbg);color:#fff}
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.steps .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accbg);border:1px solid rgba(229,37,45,.5);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:20px;font-weight:800;line-height:1}
.steps b{display:block;font-size:16px}
.steps span{color:var(--mut);font-size:14.5px;line-height:1.4}
.meta{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;margin:4px 0 6px}
.meta .time{color:#fff;font-weight:700}
.fine{color:var(--mut);font-size:13.5px;margin:12px 0}
.q{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;margin:0 0 14px;transition:border-color .2s}
.q[hidden],.opt[hidden]{display:none}
.q.err{border-color:var(--acc);box-shadow:0 0 0 3px rgba(229,37,45,.15)}
.ql{font-weight:650;font-size:17px;line-height:1.35;display:block;margin-bottom:4px}
.ql .req{color:var(--acc2);margin-left:4px}
.help{color:var(--mut);font-size:14.5px;margin:2px 0 10px;line-height:1.4}
.waiver{font-size:13.5px;color:#cfcfd2;background:var(--bg);border-left:3px solid var(--acc);padding:11px 13px;margin:8px 0 12px;border-radius:8px;line-height:1.45}
input[type=text],input[type=number],input[type=email],input[type=tel],textarea{width:100%;background:var(--bg);color:var(--txt);border:1.5px solid var(--line2);border-radius:14px;padding:15px 14px;font-size:17px;font-family:inherit;margin-top:6px;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:#5f5f66}
textarea{min-height:112px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(229,37,45,.18)}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{display:flex;align-items:center;gap:13px;min-height:56px;padding:12px 14px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:16.5px;line-height:1.3;transition:border-color .18s,background .18s,transform .12s}
.opt .dot{flex:0 0 24px;height:24px;border:2px solid #55555c;border-radius:50%;position:relative;transition:all .18s}
.opt.multi .dot{border-radius:7px}
.opt.on{border-color:var(--acc);background:linear-gradient(0deg,var(--accbg),var(--accbg)),var(--bg)}
.opt.on .dot{border-color:var(--acc);background:var(--acc)}
.opt.on .dot::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.opt:not(.multi).on .dot::after{left:6px;top:6px;width:8px;height:8px;border:0;background:#fff;border-radius:50%;transform:none}
.opt:active{transform:scale(.985)}
.opt:focus-visible,.btn:focus-visible,.scale button:focus-visible,.yn button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.opt .t{flex:1}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.scale button,.yn button{min-height:56px;font-size:19px;font-weight:750;background:var(--bg);color:var(--txt);border:1.5px solid var(--line);border-radius:14px;font-family:inherit;transition:all .18s;cursor:pointer}
.scale button:active,.yn button:active{transform:scale(.97)}
.scale button.on,.yn button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(229,37,45,.28)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.yn button{min-height:60px}
.msg{display:none;margin-top:10px;font-size:14px;font-weight:650;color:var(--acc2)}
.err .msg{display:block}
.alert{display:none;margin-top:12px;background:#2a0b0d;border:1.5px solid var(--acc);border-radius:14px;padding:14px;font-weight:650;font-size:15.5px;line-height:1.4}
.alert.show{display:block;animation:in .4s var(--ease)}
.photo{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}

 jurisdiction.", "type": "select", "multiple": true, "options": ["I acknowledge and agree"], "required": true, "showIf": {"id": "q49", "op": "in", "value": ["TRT only (physician-prescribed testosterone)", "Cruising (low-dose maintenance between blasts)", "Blasting (active growth cycle)", "Off cycle (between cycles)"]}}, {"id": "q51", "n": 51, "section": "enhanced", "label": "Are you currently using anything that's NOT prescribed to you (steroids or peptides)?", "helpText": "Honest answers only. I'd rather know now than find out at month six.", "type": "yesno", "options": null, "required": true, "showIf": {"id": "q49", "op": "in", "value": ["TRT only (physician-prescribed testosterone)", "Cruising (low-dose maintenance between blasts)", "Blasting (active growth cycle)", "Off cycle (between cycles)"]}}, {"id": "q52", "n": 52, "section": "enhanced", "label": "Any concerning symptoms right now?", "helpText": null, "type": "select", "multiple": true, "options": ["High resting heart rate", "High blood pressure", "Mood changes", "Sleep disruption", "Injection site issues", "Something else that worries me", "None"], "required": true, "showIf": {"id": "q49", "op": "in", "value": ["TRT only (physician-prescribed testosterone)", "Cruising (low-dose maintenance between blasts)", "Blasting (active growth cycle)", "Off cycle (between cycles)"]}, "exclusiveOptions": ["None"]}, {"id": "q53", "n": 53, "section": "enhanced", "label": "Medical oversight", "helpText": null, "type": "radio", "options": ["Working with an HRT clinic", "My doctor is aware and monitoring", "No formal oversight (self-managed)"], "required": true, "showIf": {"id": "q49", "op": "in", "value": ["TRT only (physician-prescribed testosterone)", "Cruising (low-dose maintenance between blasts)", "Blasting (active growth cycle)", "Off cycle (between cycles)"]}}, {"id": "q54", "n": 54, "section": "mindset", "label": "How coachable are you?", "helpText": "1 = I'll argue with everything, 10 = I'll do exactly what you tell me. I can work with either, but I need to know.", "type": "scale", "min": 1, "max": 10, "options": null, "required": true, "showIf": null}, {"id": "q55", "n": 55, "section": "mindset", "label": "How do you want me to talk to you?", "helpText": null, "type": "radio", "options": ["Direct / data-driven (give me the numbers and reasoning)", "Warm / encouraging (I need positive reinforcement)", "Straight talk / no fluff (call me out when I need it)", "A balanced mix"], "required": true, "showIf": null}, {"id": "q56", "n": 56, "section": "mindset", "label": "What will you NOT sacrifice for your goal?", "helpText": null, "type": "select", "multiple": true, "options": ["My health (blood pressure, heart, labs)", "Fertility or family plans", "My period / hormones (women)", "Libido and sexual function", "Sleep", "Mental health", "Time with family and friends", "Work and income", "Voice, hair and skin (women)", "Nothing, I'm all in"], "required": true, "showIf": null, "optionShowIf": {"My period / hormones (women)": {"id": "q3", "op": "eq", "value": "Female"}, "Voice, hair and skin (women)": {"id": "q3", "op": "eq", "value": "Female"}}, "exclusiveOptions": ["Nothing, I'm all in"]}, {"id": "q57", "n": 57, "section": "mindset", "label": "If you compete: if you never earned a pro card, would competing still be worth it?", "helpText": null, "type": "radio", "options": ["Yes", "Not sure", "No"], "required": false, "showIf": {"id": "q11", "op": "in", "value": ["Yes, I compete", "Planning to compete"]}}, {"id": "q58", "n": 58, "section": "mindset", "label": "If we work together and you get exactly what you want, what does that look like?", "helpText": "Your body, energy, routine, confidence, life", "type": "textarea", "options": null, "placeholder": "a few sentences", "required": false, "showIf": null}]};
const HOMEWORK_HTML = "<p>This is how I get the real picture of your life, food and training, so please don't skip it.</p>\n<p><strong>The plan:</strong> log for <strong>3 days</strong> (Day 1, 2, 3). On <strong>Day 4</strong>, email everything back to me at <strong>intake@millslaglemethod.com</strong> with the subject line <strong>PREP</strong>. Once I have it, we'll book your call and I'll build your plan.</p>\n<h2>What you're sending me</h2>\n<ol>\n<li><strong>3-day weighed food and drink log</strong></li>\n<li><strong>Daily steps</strong></li>\n<li><strong>Training log</strong> (exercises, sets, reps, load)</li>\n<li><strong>Current compounds and doses</strong> <em>(only if they apply)</em></li>\n<li><strong>Your last bloodwork</strong> <em>(PDF or photo)</em></li>\n<li><strong>Photos:</strong> front and back (required), side (recommended)</li>\n</ol>\n<h2>How to log your food and drink</h2>\n<ul>\n<li><strong>Use a food scale.</strong> Weigh in grams. For drinks, write ounces or ml.</li>\n<li><strong>Weigh and write it down as you go.</strong> Not tonight from memory.</li>\n<li><strong>Raw or cooked?</strong> Put <strong>R</strong> or <strong>C</strong> in the last column.</li>\n<li><strong>Write down EVERYTHING:</strong></li>\n<li>meals and snacks, even bites and tastes</li>\n<li><strong>drinks:</strong> coffee, juice, soda, alcohol, shakes, and how much water</li>\n<li><strong>condiments:</strong> sauces, dressings, oils, butter, creamer, sugar</li>\n<li><strong>supplements:</strong> vitamins, protein, creatine, pre-workout, everything</li>\n<li><strong>Eat like you normally eat.</strong> Don't clean it up. An honest log beats a perfect one.</li>\n<li><strong>Missed weighing something?</strong> Write \"estimate\" and your best guess.</li>\n</ul>\n<h2>How to track steps and training</h2>\n<ul>\n<li><strong>Steps:</strong> write your total at the end of each day. Your phone's health app is fine.</li>\n<li><strong>Training:</strong> log every exercise you do, with sets, reps and the weight. No workout? Write <strong>REST</strong>.</li>\n</ul>\n<h2>Day 4: Send it (Day 1-3 log sheets are in the PDF)</h2>\n<p><strong>4. Current compounds and doses</strong> <em>(only if they apply)</em></p>\n<p>List everything you're taking now, or write <strong>natural</strong>.</p>\n\n<p><strong>5. Last bloodwork</strong></p>\n<p>Attach the full results as a <strong>PDF or photo</strong>. If it's <strong>older than 12 weeks</strong>, still send it and tell me the date.</p>\n<p><strong>6. Photos</strong></p>\n<p>Attach a <strong>front</strong> and <strong>back</strong> photo (required) and a <strong>side</strong> photo (recommended). Relaxed standing, arms at sides, gym shorts and a training top, good lighting.</p>\n<h2>Email checklist</h2>\n<ul>\n<li>\u2610 Day 1, 2 and 3 food and drink logs</li>\n<li>\u2610 Steps for each day</li>\n<li>\u2610 Training for each day</li>\n<li>\u2610 Compounds and doses (or \"natural\")</li>\n<li>\u2610 Bloodwork (date if over 12 weeks old)</li>\n<li>\u2610 Front and back photos (side recommended)</li>\n</ul>\n<p><strong>Send on Day 4 to intake@millslaglemethod.com. Subject: PREP.</strong></p>\n<p><em>\u2014 Joe</em></p>";

  const v = answers[c.id];
  if (c.op === "eq") return v === c.value;
  if (c.op === "neq") return v !== undefined && v !== c.value;
  if (c.op === "in") return typeof v === "string" ? c.value.includes(v) : Array.isArray(v) && v.some(x => c.value.includes(x));
  return true;
}
function qVisible(q) { return cond(q.showIf); }
function secVisible(s) { return cond(s.showIf) && s.questions.some(id => qVisible(Q[id])); }
function screens() { return ["welcome"].concat(SEC.filter(secVisible).map(s => s.id)); }
function empty(v) { return v === undefined || v === null || v === "" || (Array.isArray(v) && v.length === 0); }
function save() { if (CONFIG.SAVE_PROGRESS) { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} } }

const $ = (s, r = document) => r.querySelector(s);
const main = $("#main"), bNext = $("#bNext"), bBack = $("#bBack");
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- controls ---------- */
function buildQuestion(q) {
  const box = el("div", "q"); box.dataset.id = q.id;
  const lab = el("label", "ql", esc(q.label) + (q.required ? '<span class="req">*</span>' : ""));
  box.appendChild(lab);
  if (q.helpText) {
    box.appendChild(el("div", q.id === "q50" ? "waiver" : "help", esc(q.helpText)));
  }
  const val = answers[q.id];
  const set = (v) => { if (empty(v)) delete answers[q.id]; else answers[q.id] = v; save(); afterChange(q.id); };
  if (q.type === "text" || q.type === "number" || q.type === "email" || q.type === "tel") {
    const i = el("input"); i.type = q.type;
    if (q.type === "number") { i.inputMode = "decimal"; i.min = "0"; i.step = "any"; }
    if (q.type === "email") { i.inputMode = "email"; i.autocomplete = "email"; i.autocapitalize = "none"; i.spellcheck = false; }
    if (q.type === "tel") { i.inputMode = "tel"; i.autocomplete = "tel"; }
    if (q.id === "q9") { i.autocapitalize = "none"; i.spellcheck = false; }
    i.name = q.id; if (!i.autocomplete) i.autocomplete = "off"; i.placeholder = q.placeholder || "";
    i.value = val || ""; i.setAttribute("aria-label", q.label);
    i.addEventListener("input", () => set(i.value.trim())); box.appendChild(i);
    lab.htmlFor = i.id = "f_" + q.id;
  } else if (q.type === "textarea") {
    const i = el("textarea"); i.name = q.id; i.placeholder = q.placeholder || ""; i.value = val || "";
    i.addEventListener("input", () => set(i.value.trim())); box.appendChild(i);
    lab.htmlFor = i.id = "f_" + q.id;
  } else if (q.type === "radio" || q.type === "select") {
    const multi = q.type === "select";
    const wrap = el("div", "opts"); wrap.setAttribute("role", multi ? "group" : "radiogroup");
    q.options.forEach(o => {
      const d = el("div", "opt" + (multi ? " multi" : ""), '<span class="dot"></span><span class="t">' + esc(o) + "</span>");
      d.dataset.v = o; d.tabIndex = 0; d.setAttribute("role", multi ? "checkbox" : "radio");
      const on = multi ? (val || []).includes(o) : val === o;
      if (on) d.classList.add("on"); d.setAttribute("aria-checked", on);
      const click = () => {
        if (multi) {
          let cur = (answers[q.id] || []).slice();
          const ex = (q.exclusiveOptions || []).includes(o);
          if (cur.includes(o)) cur = cur.filter(x => x !== o);
          else if (ex) cur = [o];
          else cur = cur.filter(x => !(q.exclusiveOptions || []).includes(x)).concat([o]);
          set(cur);
        } else set(o);
        syncOpts(box, q);
      };
      d.addEventListener("click", click);
      d.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); click(); } });
      wrap.appendChild(d);
    });
    box.appendChild(wrap);
  } else if (q.type === "scale") {
    const w = el("div", "scale");
    for (let n = q.min; n <= q.max; n++) {
      const b = el("button", "", String(n)); b.type = "button"; b.dataset.v = n;
      if (String(val) === String(n)) b.classList.add("on");
      b.addEventListener("click", () => { set(String(n)); w.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v == n)); });
      w.appendChild(b);
    }
    box.appendChild(w);
  } else if (q.type === "yesno") {
    const w = el("div", "yn");
    ["Yes", "No"].forEach(o => {
      const b = el("button", "", o); b.type = "button"; b.dataset.v = o;
      if (val === o) b.classList.add("on");
      b.addEventListener("click", () => { set(o); w.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === o)); });
      w.appendChild(b);
    });
    box.appendChild(w);
  }
  box.appendChild(el("div", "msg", "Required"));
  if (q.alertIf) box.appendChild(el("div", "alert", esc(q.alertIf.message)));
  return box;
}
function syncOpts(box, q) {
  const val = answers[q.id];
  box.querySelectorAll(".opt").forEach(d => {
    const on = q.type === "select" ? (val || []).includes(d.dataset.v) : val === d.dataset.v;
    d.classList.toggle("on", on); d.setAttribute("aria-checked", on);
  });
}
/* re-run branching for the current screen: show/hide questions and options, clear hidden answers */
function afterChange(changedId) {
  let again = true, guard = 0;
  while (again && guard++ < 10) {
    again = false;
    FORM.questions.forEach(q => {
      if (!qVisible(q) && answers[q.id] !== undefined) { delete answers[q.id]; again = true; }
      if (q.optionShowIf && Array.isArray(answers[q.id])) {
        const keep = answers[q.id].filter(o => !q.optionShowIf[o] || cond(q.optionShowIf[o]));
        if (keep.length !== answers[q.id].length) { answers[q.id] = keep; if (!keep.length) delete answers[q.id]; again = true; }
      }
    });
  }
  save(); applyVisibility();
}
function applyVisibility() {
  document.querySelectorAll(".q").forEach(box => {
    const q = Q[box.dataset.id], vis = qVisible(q);
    box.hidden = !vis;
    if (!vis) {
      box.classList.remove("err");
      const t = box.querySelector("input[type=text],input[type=number],input[type=email],input[type=tel],textarea"); if (t) t.value = "";
      box.querySelectorAll(".opt.on,.scale .on,.yn .on").forEach(x => x.classList.remove("on"));
    }
    box.querySelectorAll(".opt").forEach(d => {
      const c = q.optionShowIf && q.optionShowIf[d.dataset.v];
      d.hidden = !!(c && !cond(c));
    });
    if (q.alertIf) {
      const al = box.querySelector(".alert"), was = al.classList.contains("show"), now = answers[q.id] === q.alertIf.value;
      al.classList.toggle("show", now);
      if (now && !was) setTimeout(() => al.scrollIntoView({ behavior: "smooth", block: "center" }), 50);
    }
  });
  updateProgress();
}
function updateProgress() {
  const list = screens(); const i = list.indexOf(screen);
  const pct = screen === "done" ? 100 : Math.round((Math.max(i, 0) / list.length) * 100);
  $("#barfill").style.width = pct + "%";
  if (screen === "welcome") $("#stepl").textContent = "New client intake";
  else if (screen === "done") $("#stepl").textContent = "Done";
  else $("#stepl").textContent = i + " / " + (list.length - 1);
}

/* ---------- screens ---------- */
function show(id) {
  screen = id; window.scrollTo(0, 0); main.innerHTML = "";
  bBack.classList.toggle("hide", id === "welcome");
  const list = screens();
  if (id === "welcome") {
    main.appendChild(el("div", "view hero", `<div class="eyebrow">New client application</div>
      <h1>Apply to train<br>with an <em>IFBB Pro</em></h1>
      <p class="lead">I'm Joe. Tell me where you are and where you want to compete, and I'll build the plan to get you there.</p>
      <div class="price"><b>$400</b><span>per month for coaching</span></div>
      <div class="chips"><span class="chip hot">IFBB Pro</span><span class="chip">Men's Physique</span><span class="chip">Contest prep coach</span><span class="chip">About 10 min</span></div>
      <ol class="steps">
        <li><span class="n">1</span><div><b>Apply</b><span>Mostly taps. You only see the questions that fit you.</span></div></li>
        <li><span class="n">2</span><div><b>3-day homework</b><span>Log your food, steps and training, then send it all on Day 4.</span></div></li>
        <li><span class="n">3</span><div><b>Call and plan</b><span>I go through everything with you, then we build your plan.</span></div></li>
      </ol>
      <div class="meta"><span class="time">About 10 minutes</span><span>·</span><span>Answer honestly, there are no wrong answers</span></div>
      <div class="banner">Photos: you won't upload them here. You'll attach them to your Day 4 homework email.</div>
      <p class="fine">Your answers go straight to my inbox.</p>`));
    bNext.textContent = "Start"; bBack.classList.add("hide");
  } else {
    const s = SEC.find(x => x.id === id);
    const view = el("div", "view");
    view.appendChild(el("p", "secno", "Section " + list.indexOf(id) + " of " + (list.length - 1)));
    view.appendChild(el("h2", "sec", esc(s.title.replace(/^\d+\.\s*/, ""))));
    if (s.intro) view.appendChild(el("p", "intro", esc(s.intro)));
    if (s.instructions) s.instructions.forEach(p => view.appendChild(el("div", "photo", `<b>${esc(p.title)}<span class="tag ${p.tag}">${p.tag}</span></b><span>${esc(p.text)}</span>`)));
    s.questions.forEach(qid => view.appendChild(buildQuestion(Q[qid])));
    main.appendChild(view);
    const last = list[list.length - 1] === id;
    bNext.textContent = last ? "Send my answers" : "Next";
    applyVisibility();
  }
  updateProgress();
  bNext.disabled = false;
}
function validate() {
  const s = SEC.find(x => x.id === screen); let first = null;
  s.questions.forEach(qid => {
    const q = Q[qid], box = main.querySelector(`.q[data-id="${qid}"]`); if (!box) return;
    box.classList.remove("err"); if (!qVisible(q)) return;
    const v = answers[qid]; let bad = null;
    if (q.required && empty(v)) bad = "Required";
    else if (q.requiredValue && v !== q.requiredValue) bad = q.requiredMessage || "Required";
    else if (q.type === "number" && !empty(v) && (isNaN(Number(v)) || Number(v) <= 0)) bad = "Enter a number";
    else if (q.type === "email" && !empty(v) && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) bad = "Enter a valid email, like name@example.com";
    else if (q.type === "tel" && !empty(v) && !/^[0-9+()\-.\s]{7,}$/.test(v)) bad = "Enter a valid phone number or leave it blank";
    if (bad) { box.classList.add("err"); box.querySelector(".msg").textContent = bad; if (!first) first = box; }
  });
  if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); return false; }
  return true;
}
bNext.addEventListener("click", () => {
  const list = screens(), i = list.indexOf(screen);
  if (screen === "welcome") return show(list[1]);
  if (!validate()) return;
  if (i < list.length - 1) return show(list[i + 1]);
  submitForm();
});
bBack.addEventListener("click", () => { const list = screens(), i = list.indexOf(screen); if (i > 0) show(list[i - 1]); });

/* ---------- submit ---------- */
function flags() {
  const f = [], a = answers, has = (id, x) => Array.isArray(a[id]) && a[id].includes(x);
  if (a.q44 === "Yes") f.push("URGENT: says they have thoughts of harming themselves or feel unsafe (Q44)");
  if (Array.isArray(a.q37) && a.q37.some(x => /^Nitrates/.test(x))) f.push("NITRATES reported (Q37): hard contraindication with any PDE5 inhibitor");
  if (has("q37", "Alpha blockers")) f.push("Alpha blockers (Q37)");
  ["Cancer (any type, ever)", "Heart attack, stroke, or other heart problem", "High blood pressure", "Sleep apnea", "High red blood cell count / high hematocrit", "Kidney problems, or protein in your urine", "Liver problems, or high liver enzymes", "Diabetes or pre-diabetes"].forEach(x => { if (has("q36", x)) f.push("Medical history (Q36): " + x); });
  if (Array.isArray(a.q39) && a.q39.filter(x => x !== "None of these").length >= 2) f.push("2+ sleep apnea signs (Q39)");
  if (Array.isArray(a.q40) && a.q40.some(x => x !== "None of these")) f.push("Food / eating screen positive (Q40): " + a.q40.join("; "));
  if (a.q43 === "Yes" || a.q43 === "Maybe / not sure") f.push("Fertility / pregnancy intent: " + a.q43 + " (Q43)");
  if (a.q51 === "Yes") f.push("Currently using NON-prescribed AAS/peptides (Q51)");
  if (a.q45 === "None for over 3 months") f.push("No period for over 3 months (Q45)");
  if (a.q48 === "Yes" && (a.q47 === "Yes, on it" || a.q47 === "Considering")) f.push("Intact uterus + estrogen/HRT on or considered (Q47-48)");
  if (a.q42 && a.q42 !== "Within the last 12 weeks") f.push("Bloodwork not within 12 weeks: " + a.q42 + " (Q42)");
  return f;
}
function buildPayload() {
  const p = {};
  p["_subject"] = CONFIG.EMAIL_SUBJECT + (answers.q1 ? ": " + answers.q1 : "");
  p["_template"] = "table"; p["_captcha"] = "false"; p["_honey"] = "";
  if (answers.q7) p["_replyto"] = answers.q7;   // Reply-To of the notification email = the client, so Joe can just hit Reply
  const fl = flags();
  p["!! Flags for Joe (auto)"] = fl.length ? fl.join("\n") : "None";
  p["Path"] = (answers.q11 || "") + (answers.q49 ? " / " + answers.q49 : "");
  FORM.questions.forEach(q => {
    if (!qVisible(q)) return; const v = answers[q.id]; if (empty(v)) return;
    p[String(q.n).padStart(2, "0") + " " + q.label.slice(0, 90)] = Array.isArray(v) ? v.join(", ") : v;
  });
  p["Submitted"] = new Date().toLocaleString("en-US", { timeZone: "America/New_York" }) + " ET";
  return p;
}
async function submitForm() {
  bNext.disabled = true; bNext.innerHTML = '<span class="spin"></span>Sending';
  document.querySelectorAll(".banner.fail").forEach(b => b.remove());
  const payload = buildPayload();
  try {
    const r = await fetch(CONFIG.EMAIL_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    try { const d = await r.json(); if (d && String(d.success) === "false") console.warn("Form service said:", d.message); } catch (e) {}
    try { localStorage.removeItem(KEY); } catch (e) {}
    showDone();
  } catch (err) {
    bNext.disabled = false; bNext.textContent = "Send my answers";
    const body = Object.entries(payload).filter(([k]) => k[0] !== "_").map(([k, v]) => k + ": " + v).join("\n");
    const b = el("div", "banner fail", 'Couldn\'t send. Check your connection and tap Send again. <br><br><a style="color:#fff" href="mailto:' + CONFIG.EMAIL_TO + "?subject=" + encodeURIComponent(CONFIG.EMAIL_SUBJECT) + "&body=" + encodeURIComponent(body) + '">Or email my answers instead</a>');
    main.appendChild(b); b.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}
function showDone() {
  screen = "done"; window.scrollTo(0, 0); main.innerHTML = "";
  const bytes = Uint8Array.from(atob(PDF_B64), c => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  main.appendChild(el("div", "view hw", `<div class="done-top"><div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="eyebrow">Application received</div>
    <h1>You're in.<br><em>Here's your homework.</em></h1>
    <p class="lead" style="font-size:18px;color:#e6e4e1">Thank you. Your answers are with me. Your homework is below, and the PDF has the Day 1-3 log sheets.</p></div>
    <div class="big"><a class="btn primary" id="dl" href="${url}" download="millslagle-homework.pdf">Download homework (PDF)</a>
    <a class="btn" href="mailto:${CONFIG.EMAIL_TO}?subject=PREP">Email me on Day 4 (subject PREP)</a></div>${HOMEWORK_HTML}
    <hr><p class="fine">The Millslagle Method · IFBB Pro Men's Physique</p>`));
  $("#nav").classList.add("hide"); $("#barfill").style.width = "100%"; $("#stepl").textContent = "Done";
  document.body.style.paddingBottom = "30px";
}

show("welcome");
</script>
